name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Cari folder proyek
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$F" ]; then
            echo "settings.gradle tidak ditemukan. Isi repo:"
            ls -R | head -60
            exit 1
          fi
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: gradle -p "${{ steps.find.outputs.dir }}" build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sirenhead-jar
          path: "**/build/libs/sirenhead-*.jar"
          if-no-files-found: error
